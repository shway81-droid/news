name: Keepalive

# GitHub은 저장소에 60일간 커밋 활동이 없으면 스케줄 워크플로우를 자동 비활성화한다.
# 이 워크플로우가 매달 1일/15일에 각 워크플로우의 enable API를 호출해
# 비활성화 타이머를 리셋하므로, 커밋이 없어도 뉴스봇들이 계속 돌아간다.

on:
  schedule:
    # 매달 1일, 15일 12:00 KST (03:00 UTC)
    - cron: '0 3 1,15 * *'

  # 수동 실행 가능
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in daily_news.yml daily_economy_news.yml daily_daily_news.yml daily_briefing.yml keepalive.yml; do
            echo "Keepalive: $wf"
            gh api --method PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable"
          done
