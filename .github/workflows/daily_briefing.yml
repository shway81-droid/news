name: Daily Briefing Bot

on:
  # 정시 트리거 방식: 외부 크론(cron-job.org / Cloud Scheduler 등)이 매일 06:30 KST에
  # GitHub의 workflow_dispatch API를 호출해 실행한다.
  # workflow_dispatch로 트리거된 실행은 수 초 내에 시작되어 "정시 도착"이 보장된다.
  # → 설정 방법은 docs/BRIEFING_SCHEDULE.md 참고.
  #
  # GitHub 자체 schedule(cron)은 무료 러너에서 보통 1~2시간씩 지연돼(항상 늦게) 사용하지 않는다.
  # 아래는 참고용 — 다시 켜면 외부 트리거와 별개로 (지연된 시각에) 한 번 더 실행되어
  # 매일 중복 발송되므로, 폴백으로 쓰려면 중복 방지 로직이 함께 필요하다.
  #   schedule:
  #     - cron: '30 21 * * *'   # 21:30 UTC = 06:30 KST
  #
  # ⚠️ 미국 증시 마감(겨울 06:00 / 여름 05:00 KST) 이후에 실행해야 전일 종가가 확보된다.
  #    외부 크론을 06:00 KST보다 이르게 잡지 말 것.
  workflow_dispatch:

jobs:
  send-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run briefing bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python main_briefing.py
